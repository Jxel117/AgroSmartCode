services:

  db:
    image: postgres:14-alpine
    container_name: agrosmart-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agrosmart
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agrosmart"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: agrosmart-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: agrosmart
      JWT_SECRET: Joelelingenieromasinsanodelmundo
      JWT_EXPIRES_IN: 8h
      BCRYPT_ROUNDS: 10
      CORS_ORIGIN: http://localhost:8080
      MQTT_ENABLED: "true"
      MQTT_URL: mqtt://host.docker.internal:1884
      MQTT_USERNAME: backend_agrosmart
      MQTT_PASSWORD: joel123
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: agrosmart-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  db_data:
