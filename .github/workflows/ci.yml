name: CI – AgroSmart

# Ejecuta en cada push a main y en cada Pull Request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Tests + cobertura del Backend (Jest)
  # ──────────────────────────────────────────────
  backend-test:
    name: Backend – Jest Tests
    runs-on: ubuntu-latest

    # Levanta PostgreSQL como servicio (igual que tu docker-compose)
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrosmart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Correr migraciones de test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: agrosmart_test
          JWT_SECRET: test_secret_ci
          JWT_EXPIRES_IN: 1h
          BCRYPT_ROUNDS: 4
          MQTT_ENABLED: 'false'
        run: node src/db/migrate.js

      - name: Ejecutar tests con cobertura
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: agrosmart_test
          JWT_SECRET: test_secret_ci
          JWT_EXPIRES_IN: 1h
          BCRYPT_ROUNDS: 4
          MQTT_ENABLED: 'false'
        run: npm run test:coverage

      - name: Subir reporte de cobertura como artifact
        uses: actions/upload-artifact@v4
        if: always()   # sube aunque fallen los tests
        with:
          name: coverage-report
          path: backend/tests/reports/coverage/
          retention-days: 7

  # ──────────────────────────────────────────────
  # JOB 2: Build del Frontend (Vite)
  # ──────────────────────────────────────────────
  frontend-build:
    name: Frontend – Vite Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        env:
          VITE_API_URL: https://agrosmart-backend-15511153710.us-central1.run.app/api
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
        run: npm run build

      - name: Subir dist/ como artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ──────────────────────────────────────────────
  # JOB 3: Build de imágenes Docker (sin push)
  #         Solo valida que los Dockerfile compilan
  # ──────────────────────────────────────────────
  docker-build-check:
    name: Docker – Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen Backend (sin push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: agrosmart-backend:ci

      - name: Build imagen Frontend (sin push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: agrosmart-frontend:ci
          build-args: |
            VITE_API_URL=https://agrosmart-backend-15511153710.us-central1.run.app/api
            VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
