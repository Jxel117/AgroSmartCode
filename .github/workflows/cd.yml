name: CD – Deploy AgroSmart a GCP

# Solo se ejecuta cuando CI pasa en main (merge de PR)
on:
  workflow_run:
    workflows: ['CI – AgroSmart']
    types: [completed]
    branches: [main]

# Variables compartidas del proyecto GCP
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  BACKEND_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/agrosmart-backend
  FRONTEND_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/agrosmart-frontend

jobs:
  # Solo continúa si el CI anterior fue exitoso
  check-ci:
    name: Verificar CI exitoso
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "CI pasó correctamente, procediendo con el deploy."

  # ──────────────────────────────────────────────
  # JOB 1: Build y Push del Backend a GCR
  # ──────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Cloud Run
    runs-on: ubuntu-latest
    needs: check-ci

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Autenticar en GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configurar Docker para GCR
        run: gcloud auth configure-docker --quiet

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push imagen Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Backend en Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: agrosmart-backend
          region: ${{ env.REGION }}
          image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            PORT=4000
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=5432
            DB_USER=${{ secrets.DB_USER }}
            DB_NAME=${{ secrets.DB_NAME }}
            JWT_EXPIRES_IN=8h
            BCRYPT_ROUNDS=10
            MQTT_ENABLED=false
          secrets: |
            DB_PASSWORD=agrosmart-db-password:latest
            JWT_SECRET=agrosmart-jwt-secret:latest
          flags: '--allow-unauthenticated --min-instances=0 --max-instances=3 --memory=512Mi'

  # ──────────────────────────────────────────────
  # JOB 2: Build y Push del Frontend a GCR
  # ──────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Cloud Run
    runs-on: ubuntu-latest
    needs: deploy-backend   # espera el backend para tener la URL estable

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Autenticar en GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configurar Docker para GCR
        run: gcloud auth configure-docker --quiet

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push imagen Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=https://agrosmart-backend-15511153710.us-central1.run.app/api
            VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Frontend en Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: agrosmart-frontend
          region: ${{ env.REGION }}
          image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          flags: '--allow-unauthenticated --min-instances=0 --max-instances=2 --port=8080 --memory=256Mi'

  # ──────────────────────────────────────────────
  # JOB 3: Notificación final del deploy
  # ──────────────────────────────────────────────
  notify:
    name: Notificación de Deploy
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Deploy exitoso
        if: ${{ needs.deploy-backend.result == 'success' && needs.deploy-frontend.result == 'success' }}
        run: |
          echo "✅ Deploy completado exitosamente"
          echo "Backend: https://agrosmart-backend-15511153710.us-central1.run.app"
          echo "Commit: ${{ github.sha }}"

      - name: Deploy fallido
        if: ${{ needs.deploy-backend.result == 'failure' || needs.deploy-frontend.result == 'failure' }}
        run: |
          echo "❌ El deploy falló. Revisa los logs arriba."
          exit 1
