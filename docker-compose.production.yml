services:

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: agrosmart-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"      # AMQP — Accedido desde GCP (AgroSmart)
      - "15672:15672"    # UI de administración de RabbitMQ
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  audit-db:
    image: postgres:14-alpine
    container_name: audit-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5434:5432"   # Solo acceso interno en la EC2 por seguridad
    volumes:
      - audit_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  audit-backend:
    build:
      context: ./backend
    container_name: audit-backend
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 4001
      DB_HOST: audit-db
      DB_PORT: 5432
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      CORS_ORIGIN: http://${EC2_PUBLIC_IP}:8081
    ports:
      - "4001:4001"
    depends_on:
      audit-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  audit-dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: http://${EC2_PUBLIC_IP}:4001/api
    container_name: audit-dashboard
    ports:
      - "8081:80"
    depends_on:
      - audit-backend
    restart: unless-stopped

networks:
  default:
    name: audit-net

volumes:
  rabbitmq_data:
  audit_db_data: